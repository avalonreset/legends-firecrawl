name: Offline behavior
on:
  push:
    branches: [main]
  pull_request:
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      FIRECRAWL_DISABLE_USER_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e . pytest build wheel
      - run: python -m pytest tests -q
      - run: node --test tests/test_native_router.js
      - run: python -m build --wheel
      - run: python scripts/verify_wheel.py dist
