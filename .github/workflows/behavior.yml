name: Offline behavior
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      FIRECRAWL_DISABLE_USER_ENV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade "pip>=26.2.2"
      - run: python -m pip install -e . pytest build wheel
      - run: python scripts/check_release.py
      - run: python -m pytest tests -q
      - run: node --test tests/test_native_router.js
      - run: python -m build --wheel
      - run: python scripts/verify_wheel.py dist
