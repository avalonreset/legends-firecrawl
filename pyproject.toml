[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-firecrawl"
dynamic = ["version"]
description = "Official Firecrawl API and CLI workflows for Legends agents"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
lfc = "legends_firecrawl.cli:main"
lax = "legends_firecrawl.cli:lax_main"
legends-firecrawl = "legends_firecrawl.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "legends_firecrawl.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
legends_firecrawl = ["routes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
