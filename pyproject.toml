[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-firecrawl"
version = "0.1.0+local.20260830"
description = "Direct-API and official-CLI runtime for Legends Firecrawl"
requires-python = ">=3.10"
license = {text = "Proprietary house-local candidate"}

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
legends_firecrawl = ["routes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

