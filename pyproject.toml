[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-firecrawl"
dynamic = ["version"]
description = "Direct-API and official-CLI runtime for Legends Firecrawl"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "legends_firecrawl.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
legends_firecrawl = ["routes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

